# Broker de KI-1 en el nodo edge (H2).
# Copiar a /etc/mosquitto/conf.d/ki1.conf. Complementa /etc/mosquitto/mosquitto.conf,
# que en Raspberry Pi OS ya activa la persistencia en /var/lib/mosquitto/.

# Mosquitto 2.x solo escucha en localhost si no se declara un listener.
# El gateway local (teléfono) se conecta desde la WLAN del hotspot.
listener 1883 0.0.0.0

# WLAN privada del vehículo, protegida por WPA2 del hotspot (supuesto de la PoC).
allow_anonymous true

# Mensajes QoS 1 retenidos para el gateway mientras esté desconectado
# (sesión persistente). Se dimensiona como
#   max_queued_messages = autonomía (s) × Σ tasas de mensajes de los sensores (mensajes/s)
# donde la tasa de cada sensor es (observaciones por lectura) / (periodo de lectura).
# Configuración actual: 25 h × 3600 s/h × (1 / 30 s + 2 / 30 s) = 9000 (PPD42NS + DHT11).
# Al añadir o cambiar un sensor, recalcular la suma de tasas y este valor.
max_queued_messages 9000

# Guarda la persistencia cada 10 s (por defecto 1800 s): en el vehículo el nodo
# se apaga cortando la alimentación, y lo no guardado de la cola del gateway se
# pierde. Con una observación cada 30 s, el archivo es pequeño y escribirlo cada
# 10 s no supone un desgaste apreciable de la tarjeta SD.
autosave_interval 10
